name: React Doctor

on:
   pull_request:
      types: [main]

permissions:
   contents: read
   pull-requests: write
   issues: write

concurrency:
   group: react-doctor-${{ github.event.pull_request.number || github.ref }}
   cancel-in-progress: true

jobs:
   react-doctor:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v5
         - uses: millionco/react-doctor@main
