# fly.toml app configuration file generated for rick-morty-portal-api-dark-canyon-4628 on 2026-06-06T13:00:13-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rick-morty-portal-api-dark-canyon-4628'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVE_STATIC = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
