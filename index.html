<!doctype html>
<html lang="en" data-theme="light">
   <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/png" href="/favicon.png" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Rick & Morty Portal</title>
   </head>
   <body>
      <div id="root">
         <style>
            .boot-loader {
               display: flex;
               min-height: 100vh;
               align-items: center;
               justify-content: center;
               background: #0a0e14;
            }
            .boot-loader span {
               width: 2.5rem;
               height: 2.5rem;
               border: 3px solid rgba(125, 211, 160, 0.25);
               border-top-color: #7dd3a0;
               border-radius: 9999px;
               animation: boot-spin 0.8s linear infinite;
            }
            @keyframes boot-spin {
               to {
                  transform: rotate(360deg);
               }
            }
         </style>
         <div class="boot-loader" aria-busy="true" aria-label="Loading">
            <span></span>
         </div>
      </div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
